name: Update Schema Tiles

on:
  repository_dispatch:
    types: [update-schema]

jobs:
  generate-tiles:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install sharp pdfjs-dist

      - name: Download PDF from Supabase Storage
        run: |
          curl -fSL -o schema_update.pdf \
            "$SUPABASE_URL/storage/v1/object/public/tiles/schema_update.pdf"
          ls -lh schema_update.pdf

      - name: Generate and upload tiles
        run: node scripts/generate_tiles_supabase.js
