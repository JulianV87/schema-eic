name: Update Schema Tiles

on:
  repository_dispatch:
    types: [update-schema]

jobs:
  generate-tiles:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: https://fbcwsgqrwolxnqpasbgl.supabase.co
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          npm install sharp

      - name: Download PDF from Supabase Storage
        run: |
          curl -fSL -o schema_update.pdf \
            "https://fbcwsgqrwolxnqpasbgl.supabase.co/storage/v1/object/public/tiles/schema_update.pdf"
          ls -lh schema_update.pdf

      - name: Convert PDF to PNG at 300 DPI
        run: |
          pdftoppm -png -r 300 -f 1 -l 1 schema_update.pdf schema_page
          mv schema_page-1.png schema.png
          ls -lh schema.png

      - name: Generate and upload tiles
        run: node scripts/generate_tiles_supabase.js schema.png
